name: Engoo Daily News

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Articles per category'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  fetch-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1-dev

      - name: Install freqgen and dependencies
        run: |
          pip install -e .
          pip install requests kokoro-onnx soundfile

      - name: Download Kokoro TTS models
        run: |
          mkdir -p ~/.cache/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f ~/.cache/kokoro/$f ] || wget -q -P ~/.cache/kokoro \
              "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done

      - name: Download articles and generate packs
        run: |
          python scripts/download_engoo_news.py \
            --limit ${{ github.event.inputs.limit || '10' }}

      - name: Commit new article texts to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add engoo_articles/
          if git diff --cached --quiet; then
            echo "No new articles"
          else
            git commit -m "chore: update engoo articles $(date +%Y-%m-%d)"
            git push
          fi

      - name: Package and release packs
        run: |
          DATE_TAG="packs-$(date +%Y%m%d)"
          RELEASE_DIR="release-packs/$DATE_TAG"
          mkdir -p "$RELEASE_DIR"

          if [ -d engoo_news ] && find engoo_news -name '*.freqpack' | grep -q .; then
            find engoo_news -name '*.freqpack' -exec cp {} "$RELEASE_DIR/" \;
            cd release-packs
            zip -q "${DATE_TAG}.zip" "$DATE_TAG"/*
            cd ..

            echo "RELEASE_TAG=$DATE_TAG" >> $GITHUB_ENV
            echo "HAS_PACKS=true" >> $GITHUB_ENV

            gh release create "$DATE_TAG" \
              --title "Engoo News $DATE_TAG" \
              --notes "Daily packs from Engoo Daily News." \
              "release-packs/${DATE_TAG}.zip"
          else
            echo "HAS_PACKS=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cleanup
        if: always()
        run: rm -rf release-packs
