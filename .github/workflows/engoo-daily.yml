name: Engoo Daily News

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Articles per category'
        required: false
        default: '10'
      rebuild:
        description: 'Rebuild ALL packs in window (full release, for regenerating courses after generator fixes)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  fetch-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1-dev

      - name: Install freqgen
        run: |
          pip install -e .
          pip install requests kokoro-onnx soundfile

      - name: Download Kokoro TTS models
        run: |
          mkdir -p ~/.cache/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f ~/.cache/kokoro/$f ] || wget -q -P ~/.cache/kokoro \
              "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done

      - name: Download manifest from latest release
        run: |
          # manifest 由 download_engoo_news.py 内部通过 GitHub API 下载
          # （此前用 gh release download 在 runner 上不可靠，导致去重失效、
          #   每天把整个滚动窗口全部重新生成、release 体积 400MB+）
          echo "manifest download handled inside download_engoo_news.py"

      - name: Download articles and generate packs
        run: |
          python .github/scripts/download_engoo_news.py \
            --limit ${{ github.event.inputs.limit || '10' }} \
            ${{ github.event.inputs.rebuild == 'true' && '--rebuild' || '' }}

      - name: Package and create release
        run: |
          DATE_TAG="packs-$(date +%Y%m%d)"
          BASE="release-packs/EngooNews"
          mkdir -p "$BASE/business-politics" "$BASE/culture-society" "$BASE/health-lifestyle" "$BASE/science-technology" "$BASE/travel-experiences"

          for cat in business-politics culture-society health-lifestyle science-technology travel-experiences; do
            if [ -d "engoo_news/$cat" ]; then
              cp "engoo_news/$cat/"*.freqpack "$BASE/$cat/" 2>/dev/null || true
            fi
          done

          HAS_PACKS=false
          for d in "$BASE"/*/; do
            if [ "$(ls -A "$d" 2>/dev/null)" ]; then HAS_PACKS=true; fi
          done

          if [ "$HAS_PACKS" = "true" ]; then
            cd release-packs
            zip -q -r "${DATE_TAG}.zip" EngooNews
            cd ..

            gh release create "$DATE_TAG" \
              --title "Engoo News $DATE_TAG" \
              --notes "Daily .freqpack files from Engoo Daily News." \
              "release-packs/${DATE_TAG}.zip" \
              ".github/engoo_manifest.json" 2>/dev/null || \
            gh release upload "$DATE_TAG" \
              "release-packs/${DATE_TAG}.zip" \
              ".github/engoo_manifest.json" \
              --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cleanup
        if: always()
        run: rm -rf release-packs engoo_news
