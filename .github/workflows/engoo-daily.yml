name: Engoo Daily News

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Articles per category'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  fetch-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1-dev

      - name: Install freqgen
        run: |
          pip install -e .
          pip install requests kokoro-onnx soundfile

      - name: Download Kokoro TTS models
        run: |
          mkdir -p ~/.cache/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f ~/.cache/kokoro/$f ] || wget -q -P ~/.cache/kokoro \
              "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done

      - name: Download articles and generate packs
        run: |
          python .github/scripts/download_engoo_news.py \
            --limit ${{ github.event.inputs.limit || '10' }}

      - name: Commit manifest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f .engoo_manifest.json
          if git diff --cached --quiet; then
            echo "No new articles"
          else
            git commit -m "chore: update engoo manifest $(date +%Y-%m-%d)"
            git push
          fi

      - name: Package and create release
        run: |
          DATE_TAG="packs-$(date +%Y%m%d)"
          BASE="release-packs/$DATE_TAG"
          mkdir -p "$BASE/business-politics" "$BASE/science-technology"

          if [ -d engoo_news/business-politics ]; then
            cp engoo_news/business-politics/*.freqpack "$BASE/business-politics/" 2>/dev/null || true
          fi
          if [ -d engoo_news/science-technology ]; then
            cp engoo_news/science-technology/*.freqpack "$BASE/science-technology/" 2>/dev/null || true
          fi

          HAS_PACKS=false
          for d in "$BASE"/*/; do
            if [ "$(ls -A "$d" 2>/dev/null)" ]; then HAS_PACKS=true; fi
          done

          if [ "$HAS_PACKS" = "true" ]; then
            cd release-packs
            zip -q -r "${DATE_TAG}.zip" "$DATE_TAG"
            cd ..

            gh release create "$DATE_TAG" \
              --title "Engoo News $DATE_TAG" \
              --notes "Daily .freqpack files from Engoo Daily News." \
              "release-packs/${DATE_TAG}.zip" 2>/dev/null || \
            gh release upload "$DATE_TAG" "release-packs/${DATE_TAG}.zip" --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cleanup
        if: always()
        run: rm -rf release-packs engoo_news
