name: Engoo Daily News

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Articles per category'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  fetch-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if today's release already exists
        run: |
          TAG="packs-$(date +%Y%m%d)"
          if gh release view "$TAG" --json tagName 2>/dev/null | grep -q "$TAG"; then
            echo "Release $TAG already exists, skipping"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "SKIP=false" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Python
        if: env.SKIP == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps
        if: env.SKIP == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng libsndfile1-dev

      - name: Install freqgen
        if: env.SKIP == 'false'
        run: |
          pip install -e .
          pip install requests kokoro-onnx soundfile

      - name: Download Kokoro TTS models
        if: env.SKIP == 'false'
        run: |
          mkdir -p ~/.cache/kokoro
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            [ -f ~/.cache/kokoro/$f ] || wget -q -P ~/.cache/kokoro \
              "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done

      - name: Download articles and generate packs
        if: env.SKIP == 'false'
        run: |
          python scripts/download_engoo_news.py \
            --limit ${{ github.event.inputs.limit || '10' }}

      - name: Package and create release
        if: env.SKIP == 'false'
        run: |
          DATE_TAG="packs-$(date +%Y%m%d)"
          mkdir -p "release-packs/$DATE_TAG"

          if find engoo_news -name '*.freqpack' 2>/dev/null | grep -q .; then
            find engoo_news -name '*.freqpack' -exec cp {} "release-packs/$DATE_TAG/" \;
            cd release-packs
            zip -q "${DATE_TAG}.zip" "$DATE_TAG"/*
            cd ..

            gh release create "$DATE_TAG" \
              --title "Engoo News $DATE_TAG" \
              --notes "Daily .freqpack files from Engoo Daily News." \
              "release-packs/${DATE_TAG}.zip"
          else
            echo "No packs generated"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cleanup
        if: always()
        run: rm -rf release-packs
